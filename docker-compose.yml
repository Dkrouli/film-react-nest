services:
  webserver:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - frontend_volume:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ghcr.io/dkrouli/film-react-nest/backend:latest
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_NAME=prac
      - DATABASE_USER=prac
      - DATABASE_PASSWORD=password
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/afisha/films"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prac
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prac -d prac"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/dkrouli/film-react-nest/frontend:latest
    volumes:
      - frontend_volume:/app/dist

volumes:
  frontend_volume:
  postgres_data: